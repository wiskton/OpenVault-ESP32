; StickC PLUS2 uses the m5stick-c manifest with explicit 8 MB flash/PSRAM.
; Hardware detection and display/power pin mapping are handled by M5Unified.
[platformio]
default_envs = m5stickc-plus2

[env:m5stickc-plus2]
platform = espressif32@6.12.0
board = m5stick-c
framework = arduino
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv
extra_scripts = pre:scripts/pio_wally.py
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    m5stack/M5Unified@0.2.26
    m5stack/M5GFX@0.2.31
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=0
    -DOPENVAULT_WALLET=1
